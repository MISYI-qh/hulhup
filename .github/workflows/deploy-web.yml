# Membangun Hulhup (Flutter web) dari repo MISYI-qh/hulhup-new-nih dan menerbitkannya ke GitHub Pages
# di hulhup.my.id. Dijalankan manual. Butuh: Settings > Pages > Source = "GitHub Actions".
name: deploy-web
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VT: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_g0lqw9osK7s0XhtaYgq8ausr
      VERCEL_PROJECT_ID: prj_M5GYnHzGlcU6CosfJ6QXlStxwIpu
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: MISYI-qh/hulhup-new-nih, path: app }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Siapkan proyek Flutter
        working-directory: app
        run: |
          flutter create . --project-name hulhup --org app.misyi --platforms=android,web,linux,windows,macos,ios
          bash tool/setup_android.sh
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build web
        working-directory: app
        run: |
          cp ../site/index.html web/index.html
          flutter build web --release --base-href / --pwa-strategy=none --dart-define=API_URL=https://hulhup-api.vercel.app
      - name: Build APK (diunduh dari hulhup.my.id)
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=API_URL=https://hulhup-api.vercel.app --dart-define=BUILD=${{ github.run_number }}
      - name: Gabungkan CNAME dan service worker pembersih
        run: |
          cp CNAME app/build/web/CNAME
          cp tool/sw-reset.js app/build/web/sw.js
          touch app/build/web/.nojekyll
          sed -i 's|main.dart.js|main.dart.js?v=${{ github.run_number }}|g' app/build/web/flutter_bootstrap.js
          sed -i 's|flutter_bootstrap.js|flutter_bootstrap.js?v=${{ github.run_number }}|' app/build/web/index.html
          cp site/robots.txt site/sitemap.xml site/llms.txt site/llms-full.txt site/humans.txt app/build/web/
          cp site/vercel.json app/build/web/vercel.json
          cp app/build/app/outputs/flutter-apk/app-release.apk app/build/web/hulhup.apk
          echo '{"build": ${{ github.run_number }}, "version": "1.3.0"}' > app/build/web/version.json
      - name: Terbitkan ke Vercel (jika VERCEL_TOKEN ada)
        if: ${{ env.VT != '' }}
        run: npx --yes vercel@latest deploy app/build/web --prod --yes --token "$VT"
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
      - id: dep
        uses: actions/deploy-pages@v4
