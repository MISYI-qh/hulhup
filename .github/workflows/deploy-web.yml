# Membangun Hulhup (Flutter web) dari repo MISYI-qh/hulhup-new-nih dan menerbitkannya ke GitHub Pages
# di hulhup.my.id. Dijalankan manual. Butuh: Settings > Pages > Source = "GitHub Actions".
name: deploy-web
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VT: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_g0lqw9osK7s0XhtaYgq8ausr
      VERCEL_PROJECT_ID: prj_M5GYnHzGlcU6CosfJ6QXlStxwIpu
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Siapkan proyek Flutter
        working-directory: app
        run: |
          flutter create . --project-name hulhup --org app.misyi --platforms=android,web,linux,windows,macos,ios
          bash tool/setup_android.sh
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          python3 tool/patch_splash.py
      - name: Build web
        working-directory: app
        run: |
          cp ../site/index.html web/index.html
          # Utamakan WebAssembly (jauh lebih ringan di CPU HP); bila ada paket yang belum kompatibel, pakai build JavaScript biasa.
          flutter build web --release --wasm --no-web-resources-cdn --base-href / --pwa-strategy=none --dart-define=API_URL=https://hulhup-api.vercel.app \
            || flutter build web --release --no-web-resources-cdn --base-href / --pwa-strategy=none --dart-define=API_URL=https://hulhup-api.vercel.app
          ls build/web | head -40
      - name: Build APK (diunduh dari hulhup.my.id)
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define=API_URL=https://hulhup-api.vercel.app --dart-define=BUILD=${{ github.run_number }}
      - name: Tautan aplikasi (Android App Links)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore app/tool/hulhup.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          test -n "$FP"
          mkdir -p app/build/web/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"app.misyi.hulhup","sha256_cert_fingerprints":["%s"]}}]' "$FP" > app/build/web/.well-known/assetlinks.json
          cat app/build/web/.well-known/assetlinks.json
      - name: Gabungkan CNAME dan service worker pembersih
        run: |
          cp CNAME app/build/web/CNAME
          cp tool/sw-reset.js app/build/web/sw.js
          touch app/build/web/.nojekyll
          sed -i 's|main.dart.js|main.dart.js?v=${{ github.run_number }}|g' app/build/web/flutter_bootstrap.js
          sed -i 's|flutter_bootstrap.js|flutter_bootstrap.js?v=${{ github.run_number }}|' app/build/web/index.html
          cp site/robots.txt site/sitemap.xml site/llms.txt site/llms-full.txt site/humans.txt app/build/web/
          cp site/favicon.png site/favicon.ico site/favicon-48.png app/build/web/
          cp site/vercel.json app/build/web/vercel.json
          mkdir -p app/build/web/api && cp site/api/page.js app/build/web/api/page.js
          cp app/build/app/outputs/flutter-apk/app-release.apk app/build/web/hulhup.apk
          S64=$(stat -c%s app/build/web/hulhup.apk)
          echo "{\"build\": ${{ github.run_number }}, \"version\": \"1.3.0\", \"size\": $S64, \"size32\": $S64}" > app/build/web/version.json
      - name: Terbitkan ke Vercel (jika VERCEL_TOKEN ada)
        if: ${{ env.VT != '' }}
        run: npx --yes vercel@latest deploy app/build/web --prod --yes --token "$VT"
      - name: Terbitkan API ke Vercel (hulhup-api)
        if: ${{ env.VT != '' }}
        working-directory: app/backend/api
        env:
          VERCEL_PROJECT_ID: prj_9N0lGmoRxIzUSkCYOMBTEFOnytI3
        run: npx --yes vercel@latest deploy --prod --yes --token "$VT"
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
      - id: dep
        continue-on-error: true
        uses: actions/deploy-pages@v4
