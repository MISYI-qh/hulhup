# Membangun Hulhup (web Next.js + aplikasi Android Kotlin) dari repo MISYI-qh/hulhup-new-nih dan menerbitkannya ke Vercel (hulhup.my.id).
# Dijalankan manual. APK hanya dilayani lewat /api/dl dengan kunci aplikasi (tidak ada tautan unduh publik).
name: deploy-web
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VT: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_g0lqw9osK7s0XhtaYgq8ausr
      VERCEL_PROJECT_ID: prj_M5GYnHzGlcU6CosfJ6QXlStxwIpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MISYI-qh/hulhup-new-nih
          token: ${{ secrets.SRC_TOKEN || github.token }}
          path: src
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lisensi SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build APK (Kotlin, tanda tangan sama dengan APK lama)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export BUILD=${{ github.run_number }}
          export DL_KEY=$(printf 'dl:%s' "$KEYSTORE_PASSWORD" | sha256sum | cut -c1-32)
          gradle -p src/android-native assembleRelease --no-daemon
          ls src/android-native/app/build/outputs/apk/release/
      - name: Siapkan web Next.js
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          W=src/web
          APK=$(ls src/android-native/app/build/outputs/apk/release/*.apk | head -1)
          FP=$(keytool -list -v -keystore src/tool/hulhup.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          test -n "$FP"
          mkdir -p $W/public/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"app.misyi.hulhup","sha256_cert_fingerprints":["%s"]}}]' "$FP" > $W/public/.well-known/assetlinks.json
          DLK=$(printf 'dl:%s' "$KEYSTORE_PASSWORD" | sha256sum | cut -c1-32)
          DIR=$(openssl rand -hex 16)
          sed -i "s|__DL_KEY__|$DLK|;s|__DL_DIR__|$DIR|" $W/app/api/dl/route.ts
          mkdir -p $W/public/_f/$DIR
          cp "$APK" $W/public/_f/$DIR/hulhup.apk
          S=$(stat -c%s "$APK")
          echo "{\"build\": ${{ github.run_number }}, \"version\": \"2.0.0\", \"size\": $S, \"size32\": $S}" > $W/public/_f/$DIR/version.json
          cp "$APK" /tmp/hulhup.apk
      - name: Simpan APK di GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" /tmp/hulhup.apk --repo "$GITHUB_REPOSITORY" --title "Hulhup build ${{ github.run_number }}" --notes "Build ${{ github.run_number }}" --latest
      - name: Terbitkan web ke Vercel (hulhup-web)
        if: ${{ env.VT != '' }}
        working-directory: src/web
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VT"
      - name: Terbitkan API ke Vercel (hulhup-api)
        if: ${{ env.VT != '' }}
        working-directory: src/backend/api
        env:
          VERCEL_PROJECT_ID: prj_9N0lGmoRxIzUSkCYOMBTEFOnytI3
        run: npx --yes vercel@latest deploy --prod --yes --token "$VT"
